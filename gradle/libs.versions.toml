kotlin = "2.2.21"
kotlinxSerializationJson = "1.7.3"
kotzillaSdkKtor3 = "1.3.0"
ktorClientContentNegotiation = "3.3.2"
ktorClientDarwin = "3.3.1"
ktorSerializationKotlinxJson = "3.3.2"
navigation = "2.9.1"
auth = "2.3.1"
